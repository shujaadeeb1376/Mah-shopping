
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازیابی رمز | ماه‌شاپینگ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma;background:#f5f5f2;padding:20px;color:#333}
main{max-width:420px;margin:60px auto;background:white;padding:24px;border-radius:14px}
h2{color:#542d3b}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ddd;font:inherit}
button{background:#542d3b;color:white;border:0}
</style>
</head>
<body>
<main>
<h2>تعیین رمز جدید</h2>
<p>رمز جدید حساب مدیریت خود را وارد کنید.</p>
<input id="pass1" type="password" placeholder="رمز جدید" autocomplete="new-password">
<input id="pass2" type="password" placeholder="تکرار رمز جدید" autocomplete="new-password">
<button id="save">ذخیره رمز جدید</button>
<p id="msg"></p>
</main>
<script>
const db=window.supabase.createClient(
 "https://zzhldihcsluaqrorepyk.supabase.co",
 "sb_publishable_AG8BoMnbpBkpyn-ZuxrcaA_CJx5HIOo"
);
const msg=document.getElementById("msg");
async function init(){
 const {data,error}=await db.auth.getSession();
 if(error||!data.session){
  msg.textContent="لینک بازیابی معتبر نیست یا منقضی شده است. لطفاً ایمیل بازیابی تازه درخواست کنید.";
 }
}
init();
document.getElementById("save").onclick=async()=>{
 const a=document.getElementById("pass1").value;
 const b=document.getElementById("pass2").value;
 if(a.length<8){msg.textContent="رمز باید حداقل ۸ حرف داشته باشد.";return;}
 if(a!==b){msg.textContent="دو رمز یکسان نیستند.";return;}
 msg.textContent="در حال ذخیره...";
 const {error}=await db.auth.updateUser({password:a});
 if(error){msg.textContent="خطا: "+error.message;return;}
 msg.textContent="رمز با موفقیت تغییر کرد. اکنون می‌توانید وارد پنل مدیریت شوید.";
};
</script>
</body>
</html>
