
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت ماه شاپینگ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial;background:#f7f2ed;color:#38252b;margin:0;padding:18px}
main{max-width:750px;margin:25px auto;background:white;padding:22px;border-radius:14px}
h2,h3{color:#762d45}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{background:#762d45;color:white;border:0;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#777}
button.danger{background:#a33}
button.stock-btn{background:#23734e}
.product,.order{border:1px solid #eee;padding:14px;margin:12px 0;border-radius:10px}
.product img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:10px;align-items:center}
.row button{width:auto;flex:1}
#message{padding:10px;border-radius:8px;white-space:pre-wrap}
.hidden{display:none}
.stock-status{font-weight:bold}
.stock-zero{color:#a00}
.stock-positive{color:#176b35}
.order p{line-height:1.8;margin:6px 0}
.order strong{color:#762d45}
.order select{margin-bottom:5px}
.whatsapp{display:block;text-align:center;text-decoration:none;background:#16834b;color:white;padding:12px;border-radius:8px;margin-top:8px;font-weight:bold}
hr{margin:25px 0;border:0;border-top:1px solid #ddd}
</style>
</head>
<body>
<main>
<h2>پنل مدیریت ماه شاپینگ</h2>

<section id="login">
<h3>ورود مدیر</h3>
<input id="email" type="email" placeholder="ایمیل مدیر">
<input id="password" type="password" placeholder="رمز عبور">
<button id="loginBtn" onclick="login()">ورود</button>
</section>

<section id="panel" class="hidden">

<div class="row">
<h3>مدیریت فروشگاه</h3>
<button class="secondary" onclick="logout()">خروج</button>
</div>

<div id="message"></div>

<hr>

<h3>مدیریت سفارش‌های مشتریان</h3>
<button onclick="loadOrders()">تازه‌سازی سفارش‌ها</button>
<div id="orders">در حال دریافت سفارش‌ها...</div>

<hr>

<h3>مدیریت محصولات</h3>

<form id="productForm">
<input type="hidden" id="productId">

<label>نام محصول</label>
<input id="name" required placeholder="نام محصول">

<label>کد محصول مانند MS-002</label>
<input id="code" placeholder="MS-002">

<label>قیمت به افغانی</label>
<input id="price" type="number" min="0" step="1" required>

<label>تعداد موجودی</label>
<input id="stock" type="number" min="0" step="1" value="1" required>

<label>توضیحات محصول</label>
<textarea id="description" rows="3"></textarea>

<label>رنگ</label>
<input id="color" placeholder="مثلاً زرشکی">

<label>دسته‌بندی</label>
<select id="category">
<option value="پنجابی">پنجابی</option>
<option value="روزمره">روزمره</option>
<option value="مجلسی">مجلسی</option>
</select>

<label>عکس محصول</label>
<input id="image" type="file" accept="image/*">

<button id="saveBtn" type="submit">ذخیره محصول</button>
<button type="button" class="secondary" onclick="clearForm()">پاک کردن فورم</button>
</form>

<hr>

<h3>فهرست محصولات</h3>
<button class="secondary" onclick="loadProducts()">تازه‌سازی فهرست محصولات</button>
<div id="products"></div>

</section>
</main>

<script>
const SUPABASE_URL = "https://zzhldihcsluaqrorepyk.supabase.co";
const SUPABASE_KEY = "sb_publishable_AG8BoMnbpBkpyn-ZuxrcaA_CJx5HIOo";
const ADMIN_UID = "3b7aba09-b373-4308-b1c0-4b2afc1f128e";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

const ORDER_STATUSES = [
  "جدید",
  "تأییدشده",
  "آماده ارسال",
  "ارسال‌شده",
  "لغوشده"
];

function message(text,error=false){
  $("message").textContent=text;
  $("message").style.color=error?"#a00":"#176b35";
}

async function login(){
  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email||!password){
    alert("ایمیل و رمز عبور را وارد کنید.");
    return;
  }

  $("loginBtn").disabled=true;
  $("loginBtn").textContent="در حال ورود...";

  const {data,error}=await db.auth.signInWithPassword({email,password});

  $("loginBtn").disabled=false;
  $("loginBtn").textContent="ورود";

  if(error){
    alert("خطا در ورود: "+error.message);
    return;
  }

  if(data.user.id!==ADMIN_UID){
    await db.auth.signOut();
    alert("این حساب اجازه مدیریت ندارد.");
    return;
  }

  await showPanel();
}

async function showPanel(){
  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  await loadOrders();
  await loadProducts();
}

async function logout(){
  await db.auth.signOut();
  $("panel").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function safeText(value){
  return value===null||value===undefined||value===""?"-":String(value);
}

/* مدیریت سفارش‌ها */

async function loadOrders(){
  $("orders").textContent="در حال دریافت سفارش‌ها...";

  const {data,error}=await db.from("orders")
    .select("*")
    .order("id",{ascending:false});

  if(error){
    $("orders").textContent="خطا در دریافت سفارش‌ها: "+error.message;
    return;
  }

  $("orders").innerHTML="";

  if(!data||data.length===0){
    $("orders").textContent="هنوز سفارشی ثبت نشده است.";
    return;
  }

  data.forEach(order=>{
    const div=document.createElement("div");
    div.className="order";

    const heading=document.createElement("h3");
    heading.textContent="سفارش شماره "+order.id;

    const fields=[
      ["نام مشتری",order.customer_name],
      ["شماره تماس",order.customer_phone],
      ["شهر",order.city],
      ["کد محصول",order.product_code],
      ["تعداد",order.quantity+" عدد"],
      ["مبلغ کل",order.total_amount+" افغانی"],
      ["توضیحات",order.details],
      ["وضعیت فعلی",order.status]
    ];

    div.appendChild(heading);

    fields.forEach(([label,value])=>{
      const p=document.createElement("p");
      const strong=document.createElement("strong");
      strong.textContent=label+": ";
      p.append(strong,document.createTextNode(safeText(value)));
      div.appendChild(p);
    });

    const label=document.createElement("label");
    label.textContent="تغییر وضعیت سفارش";

    const select=document.createElement("select");

    ORDER_STATUSES.forEach(status=>{
      const option=document.createElement("option");
      option.value=status;
      option.textContent=status;
      if(order.status===status) option.selected=true;
      select.appendChild(option);
    });

    if(order.status&&!ORDER_STATUSES.includes(order.status)){
      const option=document.createElement("option");
      option.value=order.status;
      option.textContent=order.status;
      option.selected=true;
      select.appendChild(option);
    }

    const save=document.createElement("button");
    save.textContent="ذخیره وضعیت سفارش";
    save.onclick=()=>updateOrderStatus(order.id,select.value,save);

    const phone=String(order.customer_phone||"").replace(/\D/g,"");
    const wa=document.createElement("a");
    wa.className="whatsapp";
    wa.target="_blank";
    wa.rel="noopener";
    wa.textContent="تماس با مشتری در واتساپ";
    wa.href="https://wa.me/"+phone;

    div.append(label,select,save,wa);
    $("orders").appendChild(div);
  });
}

async function updateOrderStatus(id,status,button){
  if(!ORDER_STATUSES.includes(status)){
    alert("وضعیت سفارش معتبر نیست.");
    return;
  }

  const confirmed=confirm(
    "آیا می‌خواهید وضعیت سفارش شماره "+id+
    " به «"+status+"» تغییر کند؟"
  );

  if(!confirmed) return;

  button.disabled=true;
  button.textContent="در حال ذخیره...";

  const {data,error}=await db.from("orders")
    .update({status:status})
    .eq("id",id)
    .select();

  button.disabled=false;
  button.textContent="ذخیره وضعیت سفارش";

  if(error){
    message("خطا در تغییر وضعیت سفارش: "+error.message,true);
    return;
  }

  if(!data||data.length===0){
    message("وضعیت تغییر نکرد. دسترسی مدیر را بررسی کنید.",true);
    return;
  }

  message("وضعیت سفارش شماره "+id+" با موفقیت تغییر کرد.");
  await loadOrders();
}

/* مدیریت محصولات */

function clearForm(){
  $("productForm").reset();
  $("productId").value="";
  $("stock").value=1;
  $("saveBtn").textContent="ذخیره محصول";
  message("");
}

async function loadProducts(){
  $("products").textContent="در حال دریافت محصولات...";

  const {data,error}=await db.from("products")
    .select("*").order("id",{ascending:false});

  if(error){
    $("products").textContent="خطا در دریافت محصولات: "+error.message;
    return;
  }

  $("products").innerHTML="";

  if(!data.length){
    $("products").textContent="هنوز محصولی ثبت نشده است.";
    return;
  }

  data.forEach(p=>{
    const div=document.createElement("div");
    div.className="product";

    const img=document.createElement("img");
    if(p.image_url) img.src=p.image_url;
    img.alt=p.name||"محصول";

    const title=document.createElement("strong");
    title.textContent=p.name||"بدون نام";

    const details=document.createElement("p");
    details.textContent=
      "کد: "+(p.code||"-")+
      " | قیمت: "+(p.price??"-")+" افغانی";

    const stock=document.createElement("p");
    stock.className="stock-status "+(Number(p.stock)>0?"stock-positive":"stock-zero");
    stock.textContent="موجودی فعلی: "+(p.stock??0)+" عدد";

    const status=document.createElement("p");
    status.textContent="وضعیت: "+(p.is_active?"فعال":"غیرفعال");

    const edit=document.createElement("button");
    edit.textContent="ویرایش محصول";
    edit.onclick=()=>editProduct(p.id);

    const deduct=document.createElement("button");
    deduct.className="stock-btn";
    deduct.textContent="کاهش موجودی پس از فروش";
    deduct.disabled=Number(p.stock)<=0;
    deduct.onclick=()=>deductStock(p);

    const toggle=document.createElement("button");
    toggle.className="danger";
    toggle.textContent=p.is_active?"غیرفعال‌سازی":"فعال‌سازی";
    toggle.onclick=()=>toggleProduct(p);

    div.append(img,title,details,stock,status,edit,deduct,toggle);
    $("products").appendChild(div);
  });
}

async function editProduct(id){
  const {data,error}=await db.from("products")
    .select("*").eq("id",id).single();

  if(error){
    message("خطا در دریافت محصول: "+error.message,true);
    return;
  }

  $("productId").value=data.id;
  $("name").value=data.name||"";
  $("code").value=data.code||"";
  $("price").value=data.price??"";
  $("stock").value=data.stock??0;
  $("description").value=data.description||"";
  $("color").value=data.color||"";
  $("category").value=data.category||"پنجابی";
  $("image").value="";
  $("saveBtn").textContent="ذخیره تغییرات";

  window.scrollTo({top:0,behavior:"smooth"});
}

async function deductStock(p){
  const currentStock=Number(p.stock)||0;

  if(currentStock<=0){
    alert("این محصول موجودی ندارد.");
    return;
  }

  const answer=prompt(
    "محصول: "+p.name+
    "\nموجودی فعلی: "+currentStock+
    "\n\nچند عدد فروخته شده است؟"
  );

  if(answer===null) return;

  const quantity=Number(answer);

  if(!Number.isInteger(quantity)||quantity<1){
    alert("لطفاً تعداد صحیح و بیشتر از صفر وارد کنید.");
    return;
  }

  if(quantity>currentStock){
    alert("تعداد فروش نمی‌تواند بیشتر از موجودی باشد.");
    return;
  }

  const newStock=currentStock-quantity;

  const confirmed=confirm(
    "موجودی جدید این محصول "+newStock+
    " عدد خواهد شد.\nآیا تأیید می‌کنید؟"
  );

  if(!confirmed) return;

  const {data,error}=await db.from("products")
    .update({stock:newStock})
    .eq("id",p.id)
    .eq("stock",currentStock)
    .select();

  if(error){
    message("خطا در کاهش موجودی: "+error.message,true);
    return;
  }

  if(!data||data.length===0){
    message("موجودی تغییر کرده است یا اطلاعات تازه نیست. فهرست را تازه کنید.",true);
    await loadProducts();
    return;
  }

  message(
    "موجودی با موفقیت کاهش یافت.\n"+
    "محصول: "+p.name+
    "\nموجودی جدید: "+newStock+" عدد"
  );

  await loadProducts();
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const {data:{user}}=await db.auth.getUser();

  if(!user||user.id!==ADMIN_UID){
    message("نشست مدیر معتبر نیست؛ دوباره وارد شوید.",true);
    return;
  }

  $("saveBtn").disabled=true;
  $("saveBtn").textContent="در حال ذخیره...";

  try{
    let imageUrl=null;
    const file=$("image").files[0];

    if(file){
      const ext=file.name.split(".").pop().toLowerCase();
      const filePath="products/"+Date.now()+"."+ext;

      const {error:uploadError}=await db.storage
        .from("product-images")
        .upload(filePath,file,{upsert:false});

      if(uploadError)
        throw new Error("خطا در بارگذاری عکس: "+uploadError.message);

      const {data:urlData}=db.storage
        .from("product-images").getPublicUrl(filePath);

      imageUrl=urlData.publicUrl;
    }

    const values={
      name:$("name").value.trim(),
      code:$("code").value.trim(),
      price:Number($("price").value),
      stock:Number($("stock").value),
      description:$("description").value.trim(),
      color:$("color").value.trim(),
      category:$("category").value,
      is_active:true
    };

    if(!values.name||!Number.isFinite(values.price)||values.price<0)
      throw new Error("نام و قیمت معتبر وارد کنید.");

    if(!Number.isInteger(values.stock)||values.stock<0)
      throw new Error("موجودی باید عدد صحیح و صفر یا بیشتر باشد.");

    if(imageUrl) values.image_url=imageUrl;

    const id=$("productId").value;
    let result;

    if(id){
      result=await db.from("products")
        .update(values).eq("id",Number(id)).select();
    }else{
      result=await db.from("products")
        .insert(values).select();
    }

    if(result.error) throw result.error;

    if(!result.data||!result.data.length)
      throw new Error("ثبت تأیید نشد؛ دسترسی دیتابیس را بررسی کنید.");

    message(id?"محصول با موفقیت ویرایش شد.":"محصول جدید با موفقیت ثبت شد.");

    clearForm();
    await loadProducts();

  }catch(error){
    message("عملیات انجام نشد: "+(error.message||String(error)),true);
  }finally{
    $("saveBtn").disabled=false;
    $("saveBtn").textContent=$("productId").value?"ذخیره تغییرات":"ذخیره محصول";
  }
});

async function toggleProduct(p){
  const {error}=await db.from("products")
    .update({is_active:!p.is_active}).eq("id",p.id);

  if(error){
    message("خطا: "+error.message,true);
    return;
  }

  message("وضعیت محصول تغییر کرد.");
  await loadProducts();
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();

  if(session&&session.user.id===ADMIN_UID){
    await showPanel();
  }
})();
</script>
</body>
</html>
